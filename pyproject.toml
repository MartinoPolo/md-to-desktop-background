[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-to-desktop-background"
version = "1.0.0"
description = "Convert Markdown shortcuts file to desktop wallpaper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "tomli>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
md-to-bg = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
